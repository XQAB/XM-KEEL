[workspace]
resolver = "2"
members = [
    "crates/keel",
    "crates/keel-config",
    "crates/keel-binder",
    "crates/keel-backup",
    "crates/keel-block",
    "crates/keel-vab",
    "crates/keel-modules",
    "crates/keel-ui",
    "crates/keel-crypto",
    "crates/keel-files",
    "crates/keel-info",
    "crates/keel-install",
    "crates/keel-mtp",
    "crates/keel-net",
    "crates/keel-preview",
    "crates/keel-pack",
    "crates/keel-sensors",
    "crates/keel-sys",
    "crates/keel-lp",
    "crates/keel-bootimg",
    "crates/keel-systems",
    "crates/keel-system-init",
]

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
libc = "0.2.175"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[profile.release]
opt-level = "z"
# Optimizing across crates at link time does it at the binary's level,
# for size, over the UI's own.
lto = false
codegen-units = 1
panic = "abort"
strip = true

# The UI draws every pixel of every frame; it is built for speed.
[profile.release.package.keel-ui]
opt-level = 3
