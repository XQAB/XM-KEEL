[package]
name = "keel-mtp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
# The recovery carries no time zone files, so the rules come built in.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
libc = { workspace = true }
keel-files = { path = "../keel-files" }
keel-sys = { path = "../keel-sys" }
zerocopy = { version = "0.8.63", features = ["derive"] }
