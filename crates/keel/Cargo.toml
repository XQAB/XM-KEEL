[package]
name = "keel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.51", features = ["derive"] }
keel-config = { path = "../keel-config" }
keel-block = { path = "../keel-block" }
keel-vab = { path = "../keel-vab" }
keel-modules = { path = "../keel-modules" }
keel-info = { path = "../keel-info" }
keel-install = { path = "../keel-install" }
keel-sys = { path = "../keel-sys" }
keel-sensors = { path = "../keel-sensors" }
keel-lp = { path = "../keel-lp" }

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.14.3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
evdev = "0.13.2"
keel-backup = { path = "../keel-backup" }
keel-binder = { path = "../keel-binder" }
keel-crypto = { path = "../keel-crypto" }
keel-files = { path = "../keel-files" }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
libc = { workspace = true }
procfs = { version = "0.18.0", default-features = false }
keel-ui = { path = "../keel-ui" }
keel-mtp = { path = "../keel-mtp" }
keel-systems = { path = "../keel-systems" }
keel-net = { path = "../keel-net" }
ureq = { version = "=3.5.0", default-features = false }
